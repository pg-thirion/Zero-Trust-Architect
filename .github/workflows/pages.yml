name: Test application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and simulation regression tests
        run: |
          node --check engine.js
          node --check app.js
          node --check browser-tests.cjs
          node tests.js
      - name: Browser end-to-end tests
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          node browser-tests.cjs
